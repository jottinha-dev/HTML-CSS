<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box </title>
    <style>
        div.conteiner{
            display: flex;
            background-color: salmon;
            flex-flow: row wrap;
            
        }
        div.item {
            background-color: rgb(137, 238, 238);
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            padding: 10px;
        }
        div#i1 {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1"> A </div>
        <div class="item"> conteudo maior </div>
        <div class="item"> C </div>
        <div class="item"> um pouco maior ainda </div>
        <div class="item"> E </div>
        <div class="item"> definitivamente maior que os outros que eu escrevi anteriormente</div>
        <div class="item"> G </div>
    </div>
</body>
</html>
